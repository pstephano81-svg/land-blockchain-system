<h3>Select Land Location</h3>

<input type="text" id="address" placeholder="Enter location name">

<div id="map" style="height:300px;"></div>

<p>Lat: <span id="lat"></span></p>
<p>Lng: <span id="lng"></span></p>
<p>Area: <span id="area">0</span> m²</p>
<script>
  var map = L.map('map').setView([-6.7924, 39.2083], 13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

</script>

<script src="map.js"></script>
